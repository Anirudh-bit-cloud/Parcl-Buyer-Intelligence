[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "parcl-buyer-intelligence"
version = "0.1.0"
description = "Machine Learning based Buyer Segmentation and Investment Profiling for Real Estate Market Intelligence"
authors = [{ name = "Parcl Analytics Team & Unified Mentor" }]
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "statsmodels>=0.14.0",
    "pandera[pandas]>=0.18.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "joblib>=1.3.0",
    "duckdb>=0.10.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
    "streamlit>=1.32.0",
    "plotly>=5.20.0",
    "shap>=0.45.0",
    "umap-learn>=0.5.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.98.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[tool.setuptools.packages.find]
where = ["packages/core"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = ["B008", "E501", "N806", "N803"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_return_any = false
no_implicit_reexport = true
strict_equality = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["apps.api.tests.*", "scripts.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["packages/core/tests", "apps/api/tests"]
python_files = ["test_*.py"]
pythonpath = [".", "packages/core"]
addopts = "-v --tb=short --import-mode=importlib"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated.*:Warning",
    "ignore:Setting the shape on a NumPy array has been deprecated.*:DeprecationWarning",
]

version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - PARCL_PROJECT_ROOT=/app
    restart: unless-stopped

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

  streamlit:
    build:
      context: .
      dockerfile: apps/streamlit/Dockerfile
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
